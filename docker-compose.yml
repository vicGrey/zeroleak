services:
  ollama:
    image: ollama/ollama:latest
    container_name: zeroleak-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  ollama-init:
    image: curlimages/curl:latest
    container_name: zeroleak-ollama-init
    depends_on:
      - ollama
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for local Ollama engine to start..."
        until curl -s http://ollama:11434/api/tags > /dev/null; do
          sleep 1
        done
        echo "Checking local model cache..."
        TAGS=$$(curl -s http://ollama:11434/api/tags)
        case "$$TAGS" in
          *gemma2:2b*)
            echo "gemma2:2b is already present in volume. Offline ready!"
            ;;
          *)
            echo "Downloading gemma2:2b (~1.6GB, one-time setup)..."
            curl -s -X POST http://ollama:11434/api/pull -d '{"name": "gemma2:2b"}'
            echo ""
            echo "Gemma 2B is ready!"
            ;;
        esac

  zeroleak:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zeroleak-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully

volumes:
  ollama_models:
    name: zeroleak_ollama_models
