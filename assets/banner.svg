<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="ZeroLeak AI - Offline AWS IAM Policy Auditor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.6" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8e44ad"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#334155" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow)"/>

  <!-- shield logo -->
  <g transform="translate(70 50) scale(1.1)">
    <path d="M100 10 L178 40 V96 C178 144 146 176 100 192 C54 176 22 144 22 96 V40 Z" fill="url(#shield)"/>
    <path d="M100 22 L166 47 V96 C166 137 139 165 100 180 C61 165 34 137 34 96 V47 Z" fill="url(#inner)"/>
    <g fill="none" stroke="#e2e8f0" stroke-width="9" stroke-linecap="round">
      <path d="M58 98 Q100 62 142 98"/>
      <path d="M74 115 Q100 94 126 115"/>
    </g>
    <circle cx="100" cy="134" r="7" fill="#e2e8f0"/>
    <line x1="56" y1="60" x2="146" y2="152" stroke="#0f172a" stroke-width="18" stroke-linecap="round"/>
    <line x1="56" y1="60" x2="146" y2="152" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- text -->
  <text x="340" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="url(#title)" letter-spacing="1">ZeroLeak AI</text>
  <text x="344" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#e2e8f0">Offline AWS IAM Policy Auditor</text>
  <text x="344" y="232" font-family="Consolas, Menlo, monospace" font-size="20" fill="#94a3b8">Conftest / OPA Rego  +  Google Gemma 2 2B  •  zero telemetry</text>

  <!-- pills -->
  <g font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700">
    <rect x="344" y="256" width="150" height="32" rx="16" fill="#0f172a" stroke="#22d3ee"/>
    <text x="419" y="277" text-anchor="middle" fill="#22d3ee">NO CLOUD</text>
    <rect x="508" y="256" width="150" height="32" rx="16" fill="#0f172a" stroke="#818cf8"/>
    <text x="583" y="277" text-anchor="middle" fill="#818cf8">NO TOKENS</text>
    <rect x="672" y="256" width="150" height="32" rx="16" fill="#0f172a" stroke="#c084fc"/>
    <text x="747" y="277" text-anchor="middle" fill="#c084fc">$0 SPEND</text>
  </g>
</svg>
